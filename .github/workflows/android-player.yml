name: Build Android TV player (APK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'player-v*'
    paths:
      - 'android-player/**'
      - 'frontend/**'
      - '.github/workflows/android-player.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach the APK to a release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build the web app in TV mode
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build:tv

      - name: Sync Capacitor
        working-directory: android-player
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android-player/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-player/android/app/build/outputs/apk/debug/app-debug.apk ImageScreen-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ImageScreen-TV-apk
          path: ImageScreen-TV.apk

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/player-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ImageScreen-TV.apk
